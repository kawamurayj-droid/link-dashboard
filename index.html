<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リンクダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --paper:#EAE6D9;
    --card:#FBF9F3;
    --ink:#2B2620;
    --ink-soft:#84796a;
    --rule:#c9c0a9;
    --app:#2E5C4E;
    --app-soft:#e4ece7;
    --folder:#9C5A2E;
    --folder-soft:#f3e6da;
    --other:#3E4E6B;
    --other-soft:#e5e8ee;
    --misc:#6b4e70;
    --misc-soft:#ece3ec;
    --danger:#a4432e;
    --link:#2B4570;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    padding:22px 14px 70px;
    min-height:100vh;
  }
  #app, #loginScreen{
    max-width:760px;
    margin:0 auto;
  }
  @media(min-width:900px){
    body{padding:40px 24px 90px;}
    h1{font-size:36px;}
    .sub{font-size:15px;}
  }

  /* ---------- login screen ---------- */
  #loginScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:70vh;
    text-align:center;
    gap:16px;
  }
  #loginScreen .lock{font-size:34px;}
  #loginScreen h2{
    font-family:"Fraunces",serif;
    font-size:22px;
    margin:0;
  }
  #loginScreen p{
    color:var(--ink-soft);
    font-size:13.5px;
    max-width:34ch;
    line-height:1.6;
    margin:0;
  }
  .google-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:4px;
    padding:11px 20px;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .google-btn:active{background:#f2f0e8;}
  #authError{
    color:var(--danger);
    font-size:12.5px;
    max-width:34ch;
  }
  #authLoading{color:var(--ink-soft); font-size:13px;}

  #app{display:none;}

  .userbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .userbar button{
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
  }

  .masthead{
    margin-bottom:22px;
    padding-bottom:16px;
    border-bottom:3px double var(--ink);
  }
  h1{
    font-family:"Fraunces",serif;
    font-size:30px;
    font-weight:600;
    margin:0 0 6px;
    line-height:1.15;
  }
  .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.6;
    margin:0;
    max-width:46ch;
  }

  .toolbar{
    display:flex;
    gap:8px;
    margin:20px 0 26px;
  }
  .toolbar input{
    flex:1;
    padding:12px 14px;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--card);
    font-size:14.5px;
    color:var(--ink);
    font-family:inherit;
  }
  .toolbar input::placeholder{color:#a89e8c;}
  .toolbar input:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .add-btn{
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:2px;
    padding:12px 18px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    font-family:inherit;
  }
  .add-btn:active{opacity:0.85;}

  section{margin-bottom:32px;}
  .shelf-label{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .shelf-label .dot{
    width:9px;height:9px;border-radius:50%;
    flex-shrink:0;
  }
  .shelf-label h2{
    font-family:"Fraunces",serif;
    font-size:17px;
    font-weight:600;
    margin:0;
    flex-shrink:0;
  }
  .shelf-label .rule{
    flex:1;
    height:1px;
    background:var(--rule);
  }
  .shelf-label .count{
    font-size:11.5px;
    color:var(--ink-soft);
    flex-shrink:0;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media(min-width:900px){
    .grid{gap:16px;}
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:12px 10px 10px 14px;
    box-shadow:2px 3px 0 rgba(43,38,32,0.06);
    display:flex;
    flex-direction:column;
  }
  @media(min-width:900px){
    .card{padding:20px 18px 16px 22px;}
    .card-title{font-size:17px;}
    .card-note{font-size:13px;}
    .link-row a{font-size:13px;}
    .link-row .link-title{font-size:13.5px;}
    .card-actions button{font-size:12.5px;}
    .tag{font-size:11px;padding:2px 8px;}
  }
  .card::before{
    content:"";
    position:absolute;
    top:14px; left:-1px;
    width:5px; height:calc(100% - 28px);
    border-radius:0 3px 3px 0;
  }
  .card.cat-app::before{background:var(--app);}
  .card.cat-folder::before{background:var(--folder);}
  .card.cat-sheet::before{background:var(--other);}
  .card.cat-misc::before{background:var(--misc);}

  .tag{
    display:inline-block;
    font-size:9px;
    padding:1px 6px;
    border-radius:9px;
    margin-bottom:6px;
    font-weight:500;
  }
  .cat-app .tag{background:var(--app-soft); color:var(--app);}
  .cat-folder .tag{background:var(--folder-soft); color:var(--folder);}
  .cat-sheet .tag{background:var(--other-soft); color:var(--other);}
  .cat-misc .tag{background:var(--misc-soft); color:var(--misc);}

  .card-title{
    font-size:13.5px;
    font-weight:700;
    margin:0 0 4px;
    word-break:break-word;
    line-height:1.35;
  }
  .card-note{
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 6px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.5;
  }

  .links-list{
    margin:0 0 8px;
    padding-top:6px;
    border-top:1px dashed var(--rule);
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .link-row a{
    display:block;
    color:var(--link);
    text-decoration:none;
    font-size:11px;
    word-break:break-all;
    line-height:1.4;
  }
  .link-row a:hover{text-decoration:underline;}
  .link-row .link-title{
    display:block;
    font-weight:600;
    font-size:12px;
    color:var(--ink);
  }
  .card-empty-url{
    font-size:11px;
    color:var(--danger);
    margin:0 0 8px;
    padding-top:6px;
    border-top:1px dashed var(--rule);
  }
  .card-actions{
    display:flex;
    gap:8px 10px;
    flex-wrap:wrap;
    margin-top:auto;
  }
  .card-actions button{
    background:none;
    border:none;
    padding:0;
    font-size:10.5px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
    font-weight:500;
  }
  .card-actions button:hover{text-decoration:underline;}
  .card-actions button.del{color:var(--danger);}

  .empty-state{
    grid-column:1 / -1;
    color:var(--ink-soft);
    font-size:13px;
    padding:18px;
    border:1px dashed var(--rule);
    border-radius:3px;
    text-align:center;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(43,38,32,0.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    width:100%;
    max-width:480px;
    border-radius:14px 14px 0 0;
    padding:22px 20px 26px;
    max-height:88vh;
    overflow-y:auto;
    border-top:4px solid var(--ink);
  }
  .modal h3{
    font-family:"Fraunces",serif;
    margin:0 0 16px;
    font-size:19px;
    font-weight:600;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:500;
  }
  .field input, .field textarea, .field select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--rule);
    border-radius:3px;
    font-size:14.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--ink);outline-offset:0;}

  .links-editor label.section-label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:500;
  }
  .link-edit-row{
    display:flex;
    gap:6px;
    margin-bottom:8px;
    align-items:flex-start;
  }
  .link-edit-row .link-inputs{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .link-edit-row input{
    padding:8px 9px;
    border:1px solid var(--rule);
    border-radius:3px;
    font-size:13px;
    font-family:inherit;
  }
  .link-edit-row button{
    background:none;
    border:none;
    color:var(--danger);
    font-size:12px;
    cursor:pointer;
    padding:8px 2px;
  }
  .add-link-btn{
    background:none;
    border:1px dashed var(--rule);
    border-radius:3px;
    color:var(--ink-soft);
    padding:8px;
    font-size:12.5px;
    width:100%;
    cursor:pointer;
    font-family:inherit;
    margin-bottom:14px;
  }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .modal-actions button{
    flex:1;
    padding:12px;
    border-radius:4px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .save-btn{background:var(--ink);color:var(--paper); border:none;}
  .cancel-btn{background:transparent;color:var(--ink-soft);border:1px solid var(--rule);}

  .toast{
    position:fixed;
    bottom:20px;left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    transition:opacity 0.25s;
    pointer-events:none;
    z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
  <div class="lock">🔒</div>
  <h2>リンクダッシュボード</h2>
  <p>許可されたGoogleアカウントでログインしてください。</p>
  <button class="google-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.92c1.71-1.57 2.69-3.89 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.47.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    Googleでログイン
  </button>
  <p id="authError"></p>
  <p id="authLoading"></p>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app">

  <div class="userbar">
    <span id="userEmail"></span>
    <button onclick="signOutUser()">ログアウト</button>
  </div>

  <div class="masthead">
    <h1>リンクダッシュボード</h1>
    <p class="sub">開発したアプリと講義の共有フォルダを，探さずに済む一か所へ。</p>
  </div>

  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="名前・メモで検索…">
    <button class="add-btn" onclick="openModal()">＋ 追加</button>
  </div>

  <div id="listRoot"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">リンクを追加</h3>
    <input type="hidden" id="editId">
    <div class="field">
      <label>名前</label>
      <input id="fName" type="text" placeholder="例：国試対策アプリ">
    </div>
    <div class="field">
      <label>カテゴリ</label>
      <select id="fCategory">
        <option value="app">講義アプリ</option>
        <option value="folder">講義資料共有フォルダー</option>
        <option value="sheet">出欠シート</option>
        <option value="misc">その他</option>
      </select>
    </div>
    <div class="links-editor">
      <label class="section-label">URL（項目名＋リンク。複数追加できます）</label>
      <div id="linksContainer"></div>
      <button type="button" class="add-link-btn" onclick="addLinkRow()">＋ URLを追加</button>
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <textarea id="fNote" placeholder="用途や関係者など"></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
      <button class="save-btn" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Firebase 設定
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC9dCJdRnAV0rrnlGID6ZEId5NMmImh2jQ",
  authDomain: "link-dashboard-33ad8.firebaseapp.com",
  databaseURL: "https://link-dashboard-33ad8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "link-dashboard-33ad8",
  storageBucket: "link-dashboard-33ad8.firebasestorage.app",
  messagingSenderId: "715641780317",
  appId: "1:715641780317:web:761fc0d4191e2b9b1435b4"
};

// アクセスを許可するGoogleアカウント
const ALLOWED_EMAILS = [
  "ootaniah@nbu.ac.jp",
  "kawamurayj@nbu.ac.jp",
  "senda.keigo@nbu.ac.jp",
  "nabeta@nbu.ac.jp",
  "hashimototk@nbu.ac.jp",
  "minoyk@nbu.ac.jp"
];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let entries = [];
let modalLinks = []; // [{title, url}] being edited in the modal

const seedEntries = [
  {id:"seed1", name:"授業出席管理アプリ", category:"app", note:"",
   links:[{title:"アプリを開く", url:"https://kawamurayj-droid.github.io/lecture-attendance/"}]},
  {id:"seed2", name:"意見交換アプリ", category:"app", note:"",
   links:[{title:"アプリを開く", url:"https://kawamurayj-droid.github.io/opinion-exchange-app/"}]},
  {id:"seed3", name:"GW相互評価アプリ", category:"app", note:"",
   links:[{title:"アプリを開く", url:"https://kawamurayj-droid.github.io/peer-eval-app/"}]},
  {id:"seed4", name:"国試対策過去問アプリ", category:"app", note:"",
   links:[{title:"アプリを開く", url:"https://kawamurayj-droid.github.io/kokka-quiz-app/"}]},
  {id:"seed5", name:"ゼミナールⅡB", category:"folder", note:"",
   links:[{title:"資料フォルダ", url:"https://drive.google.com/drive/folders/1e9EMZ758THxZnm5MnhxdBgNfn9OstTaF?usp=drive_link"}]},
  {id:"seed6", name:"社会福祉入門", category:"folder", note:"",
   links:[{title:"資料フォルダ", url:"https://drive.google.com/drive/folders/1mB4PRggu2_rpwsD4vmwDo-OYWy-lz3ae?usp=sharing"}]},
  {id:"seed7", name:"実習１", category:"folder", note:"URL未登録", links:[]},
  {id:"seed8", name:"社会参画実習", category:"sheet", note:"",
   links:[{title:"出欠シート", url:"https://docs.google.com/spreadsheets/d/1V0fyaQhlFLnVVroJVo80E4u9m6afAQarCexBIqW-Jf4/edit?usp=drive_link"}]},
  {id:"seed9", name:"ゼミナールⅡB", category:"sheet", note:"",
   links:[{title:"出欠シート", url:"https://docs.google.com/spreadsheets/d/1pW90TXCHwzwP38Wp6Z4xi6brlirh7Cw5fFD9pp9dNQI/edit?usp=drive_link"}]},
  {id:"seed10", name:"ゼミナールⅢ", category:"sheet", note:"",
   links:[{title:"出欠シート", url:"https://docs.google.com/spreadsheets/d/1JMty9gaoA5PA96FOzICiPjkCEkDWh5G8dP5hJku-JTA/edit?usp=sharing"}]},
  {id:"seed11", name:"社会参画実習２", category:"sheet", note:"",
   links:[{title:"出欠シート", url:"https://docs.google.com/spreadsheets/d/1MeIPigru4sRxCiPsNCujkhfMSDETy6Gr8e7NrtOzEoA/edit?usp=sharing"}]},
];

/* ---------------- auth ---------------- */
function signIn(){
  document.getElementById("authError").textContent = "";
  document.getElementById("authLoading").textContent = "ログイン中…";
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err=>{
    document.getElementById("authLoading").textContent = "";
    document.getElementById("authError").textContent = "ログインに失敗しました: " + err.message;
  });
}

function signOutUser(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  document.getElementById("authLoading").textContent = "";
  if(user){
    const email = (user.email || "").toLowerCase();
    const allowed = ALLOWED_EMAILS.map(e=>e.toLowerCase()).includes(email);
    if(!allowed){
      document.getElementById("authError").textContent =
        "このアカウント（" + email + "）にはアクセス権がありません。指定されたアカウントでログインし直してください。";
      auth.signOut();
      return;
    }
    currentUser = user;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("userEmail").textContent = email;
    loadEntries();
  }else{
    currentUser = null;
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

/* ---------------- data ---------------- */
function dbRef(){
  return db.ref("users/" + currentUser.uid + "/links");
}

function loadEntries(){
  dbRef().once("value").then(snap=>{
    const val = snap.val();
    if(val){
      entries = Object.keys(val).map(k=>{
        const e = val[k];
        return {id:k, name:e.name, category:e.category, note:e.note||"", links:e.links||[]};
      });
    }else{
      entries = seedEntries;
      persistAll();
    }
    render();
  }).catch(()=>{
    entries = seedEntries;
    render();
  });
}

function persistAll(){
  const obj = {};
  entries.forEach(e=>{
    const {id, ...rest} = e;
    obj[id] = rest;
  });
  dbRef().set(obj).catch(()=>showToast("保存に失敗しました"));
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}

function esc(s){
  return (s||"").replace(/'/g,"\\'");
}
function escHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- modal: dynamic link rows ---------------- */
function renderLinksEditor(){
  const container = document.getElementById("linksContainer");
  container.innerHTML = "";
  modalLinks.forEach((lk, idx)=>{
    const row = document.createElement("div");
    row.className = "link-edit-row";
    row.innerHTML = `
      <div class="link-inputs">
        <input type="text" placeholder="項目名（例：資料フォルダ，出欠シート）" value="${escHtml(lk.title)}" oninput="modalLinks[${idx}].title=this.value">
        <input type="text" placeholder="https://…" value="${escHtml(lk.url)}" oninput="modalLinks[${idx}].url=this.value">
      </div>
      <button type="button" onclick="removeLinkRow(${idx})">✕</button>
    `;
    container.appendChild(row);
  });
}

function addLinkRow(){
  modalLinks.push({title:"", url:""});
  renderLinksEditor();
}

function removeLinkRow(idx){
  modalLinks.splice(idx, 1);
  renderLinksEditor();
}

function openModal(id){
  document.getElementById("overlay").classList.add("show");
  if(id){
    const e = entries.find(x=>x.id===id);
    document.getElementById("modalTitle").textContent = "リンクを編集";
    document.getElementById("editId").value = id;
    document.getElementById("fName").value = e.name;
    document.getElementById("fCategory").value = e.category;
    document.getElementById("fNote").value = e.note;
    modalLinks = (e.links || []).map(l=>({title:l.title||"", url:l.url||""}));
  }else{
    document.getElementById("modalTitle").textContent = "リンクを追加";
    document.getElementById("editId").value = "";
    document.getElementById("fName").value = "";
    document.getElementById("fCategory").value = "app";
    document.getElementById("fNote").value = "";
    modalLinks = [{title:"", url:""}];
  }
  if(modalLinks.length === 0) modalLinks = [{title:"", url:""}];
  renderLinksEditor();
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
}

function saveEntry(){
  const id = document.getElementById("editId").value;
  const name = document.getElementById("fName").value.trim();
  if(!name){ showToast("名前を入力してください"); return; }
  const cleanLinks = modalLinks
    .map(l=>({title:(l.title||"").trim(), url:(l.url||"").trim()}))
    .filter(l=>l.url);
  const data = {
    name,
    category: document.getElementById("fCategory").value,
    note: document.getElementById("fNote").value.trim(),
    links: cleanLinks
  };
  if(id){
    const idx = entries.findIndex(x=>x.id===id);
    entries[idx] = {...entries[idx], ...data};
  }else{
    entries.push({id: "e"+Date.now(), ...data});
  }
  persistAll();
  closeModal();
  render();
  showToast("保存しました");
}

function deleteEntry(id){
  entries = entries.filter(x=>x.id!==id);
  persistAll();
  render();
  showToast("削除しました");
}

/* ---------------- render ---------------- */
function render(){
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const cats = [
    {key:"app", label:"講義アプリ", cls:"cat-app", dot:"var(--app)"},
    {key:"folder", label:"講義資料共有フォルダー", cls:"cat-folder", dot:"var(--folder)"},
    {key:"sheet", label:"出欠シート", cls:"cat-sheet", dot:"var(--other)"},
    {key:"misc", label:"その他", cls:"cat-misc", dot:"var(--misc)"}
  ];
  const tagLabel = {app:"アプリ", folder:"フォルダ", sheet:"シート", misc:"その他"};
  const root = document.getElementById("listRoot");
  root.innerHTML = "";
  cats.forEach(cat=>{
    const items = entries.filter(e=>e.category===cat.key && (
      !q || e.name.toLowerCase().includes(q) || (e.note||"").toLowerCase().includes(q)
    ));
    const section = document.createElement("section");
    const head = document.createElement("div");
    head.className = "shelf-label";
    head.innerHTML = `<span class="dot" style="background:${cat.dot}"></span><h2>${cat.label}</h2><span class="rule"></span><span class="count">${items.length}件</span>`;
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";

    if(items.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "まだ登録がありません";
      grid.appendChild(empty);
    }else{
      items.forEach(e=>{
        const card = document.createElement("div");
        card.className = "card " + cat.cls;
        const links = e.links || [];
        let linksHtml;
        if(links.length === 0){
          linksHtml = `<p class="card-empty-url">URL未入力 — 編集して追加してください</p>`;
        }else{
          linksHtml = `<div class="links-list">` + links.map(lk=>{
            const safeUrl = escHtml(lk.url);
            const label = lk.title ? `<span class="link-title">${escHtml(lk.title)}</span>` : "";
            return `<div class="link-row">${label}<a href="${safeUrl}" target="_blank" rel="noopener">${safeUrl}</a></div>`;
          }).join("") + `</div>`;
        }
        const noteLine = e.note ? `<p class="card-note">${escHtml(e.note)}</p>` : "";
        const copyBtn = links.length > 0 ? `<button onclick="copyUrl('${esc(links[0].url)}')">コピー</button>` : "";
        card.innerHTML = `
          <span class="tag">${tagLabel[cat.key]}</span>
          <p class="card-title">${escHtml(e.name)}</p>
          ${noteLine}
          ${linksHtml}
          <div class="card-actions">
            ${copyBtn}
            <button onclick="openModal('${e.id}')">編集</button>
            <button class="del" onclick="deleteEntry('${e.id}')">削除</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }
    section.appendChild(grid);
    root.appendChild(section);
  });
}

function copyUrl(url){
  if(!url){ showToast("URL未入力です"); return; }
  navigator.clipboard.writeText(url).then(()=>showToast("コピーしました"));
}

document.getElementById("searchInput").addEventListener("input", render);
</script>
</body>
</html>
